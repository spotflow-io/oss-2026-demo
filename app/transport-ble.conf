# CC35x1 gateway-relayed image.
CONFIG_SPOTFLOW_TRANSPORT_BLE=y
CONFIG_BT_DEVICE_NAME="Asset Tracker"
CONFIG_BT_DEVICE_APPEARANCE=0

# TI's CC35x1 HSM/PSA integration is not ready for the Zephyr Bluetooth host.
# The Spotflow gateway does not pair or bond, so the transport does not require these.
CONFIG_BT_SMP=n
CONFIG_BT_PRIVACY=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_CRYPTO_TI_CC35XX=n

# BT_HCI_TI_CC35XX selects the shared Wi-Fi host infrastructure and its Zephyr
# Mbed TLS entropy path even though this image never associates with an AP.
