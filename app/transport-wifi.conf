# CC35x1 direct-to-cloud image.
CONFIG_SPOTFLOW_TRANSPORT_MQTT=y

CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_CONNECTION_MANAGER=y

# TI's cooperative transport thread can otherwise starve Zephyr's queued RX
# worker during a burst. Process packets inline until TI provides backpressure.
CONFIG_NET_TC_RX_COUNT=0

# Use Zephyr's one Mbed TLS/PSA implementation for both Wi-Fi and MQTT/TLS.
CONFIG_CRYPTO=y
CONFIG_CRYPTO_TI_CC35XX=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4608
CONFIG_MBEDTLS_HEAP_SIZE=36864
