# LP-EM-CC35X1 resource and platform profile for TI Zephyr 4.4.

# Wi-Fi/MQTT is the default CC35x1 image. transport-ble.conf overrides the
# Spotflow transport choice for the gateway-relayed image.
CONFIG_SPOTFLOW_TRANSPORT_MQTT=y

# The board has no application BMI270 wiring. Start with the hardware-independent
# backend; adding a real sensor remains separate from radio enablement.
CONFIG_APP_SENSOR_SIM=y

# Native CC35x1 Wi-Fi and IPv4 connectivity.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_TI_CC35XX=y
CONFIG_WIFI_TI_CC35XX_USE_ZEPHYR_MBEDTLS=y
CONFIG_NET_L2_ETHERNET=y
# Enable TI's HSM adapter so the shared radio host and Zephyr mbedTLS use the
# CC35x1 crypto path selected by the validated Spotflow sample.
CONFIG_CRYPTO=y
CONFIG_CRYPTO_TI_CC35XX=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_AUTO_INIT=n

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64

# TI allocates TX control blocks from its separate non-cacheable DTCM heap, not
# CONFIG_HEAP_MEM_POOL_SIZE. The default 120 entries consume about 41 KiB and
# leave too little contiguous space for the supplicant's 30,672-byte candidate
# table. This low-throughput tracker needs only the supported minimum; 32 entries
# retain normal queueing while releasing about 30 KiB of DTCM. The pinned TI HAL
# also needs the CTRL_BLK_ENTRIES_NUM fallback guard documented in the README.
CONFIG_WIFI_TI_CC35XX_TX_CTRL_BLK_NUM=32

# Keep the shared 12-slot metric catalogue at four system metrics and eight
# application metrics. These optional system families default to enabled.
CONFIG_SPOTFLOW_METRICS_SYSTEM_NETWORK=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_CPU=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_STACK=n

# Required by the CC35x1 host stack and its dynamically allocated workers.
CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_MAIN_STACK_SIZE=61440
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_DYNAMIC_THREAD_PREFER_POOL=y
CONFIG_DYNAMIC_THREAD_POOL_SIZE=3
CONFIG_DYNAMIC_THREAD_STACK_SIZE=8192

# The Toolbox layout reserves flash2 for Wi-Fi NVS and HSM key storage. There is
# no safe coredump partition until that layout and the generated flash map change
# together. The watchdog still recovers the board after a deliberate fault.
CONFIG_SPOTFLOW_COREDUMPS=n

CONFIG_LOG_BACKEND_UART=y
