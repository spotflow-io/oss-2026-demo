# CC23x0 memory profile - shared by every board in the series.
#
# Pulled in for all boards by app/CMakeLists.txt rather than named after one of them:
# both supported parts run the same profile, and a second copy of it would be a second
# thing to keep correct.
#
# The budget is the CC2340R5's: 36 KiB of SRAM, shared between the TI link-layer heap
# (6.25 KiB, fixed), the Zephyr Bluetooth host, the Spotflow SDK and this application.
# Every value here was measured, not guessed - see MEMORY.md for the numbers and for what
# each lever costs. The CC2340R53 has 64 KiB and so runs this profile with room to spare;
# spending that room would make the two boards behave differently, which is the one thing
# a demo cannot afford.
#
# Derived from the board profile in spotflow-io/device-sdk PR #85, which is the only
# configuration anyone has run on this silicon. Deviations from it are marked DELTA and
# justified; treat the rest as load-bearing.

# ------------------------------------------------------------------
# DELTA: the single biggest lever we found, -960 B
# ------------------------------------------------------------------
# The SoC selects DYNAMIC_THREAD, and the TI Bluetooth stack creates its tasks through
# TI's DPL, which allocates their stacks from Zephyr's dynamic stack pool (2 slots).
# TaskP_DEFAULT_STACK_SIZE is #defined as this symbol, so the slot size and the
# requested size shrink together and the requests still fit the pool.
#
# RISK: this is the Bluetooth stack's own task stack, below TI's default. Only hardware
# proves 1024 is enough. The thread stack metrics below are pointed at it for exactly
# this reason - if headroom looks thin on the board, raise this first.
CONFIG_DYNAMIC_THREAD_STACK_SIZE=1024

# ------------------------------------------------------------------
# Bluetooth: minimum MTU, minimum buffers
# ------------------------------------------------------------------
# 23-byte ATT MTU is the BLE minimum: ~20 payload bytes per notification, about 444 B/s
# after framing. Spotflow's framing fragments anything larger. This is slow - coredump
# upload time is dominated by it - but it is what fits.
#
# MEASURED, whole-image RAM, if it is ever worth buying goodput back: MTU 23 -> 36528 B,
# 39 -> 36624, 47 -> 36672, 55 -> 36720, 69 -> 36824, of 36864. 55 is 2.6x the goodput
# for 192 B. Note that BOTH buffer sizes have to move: the local ATT MTU is
# MIN(BT_L2CAP_RX_MTU, BT_L2CAP_TX_MTU) and BT_L2CAP_RX_MTU is BT_BUF_ACL_RX_SIZE - 4,
# so raising TX alone builds clean and still negotiates 23.
CONFIG_BT_L2CAP_TX_MTU=23
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_RX_COUNT=2
CONFIG_BT_L2CAP_TX_BUF_COUNT=3
CONFIG_BT_ATT_TX_COUNT=3
CONFIG_BT_CONN_TX_MAX=3
CONFIG_BT_BUF_EVT_RX_SIZE=68
CONFIG_BT_BUF_EVT_RX_COUNT=3
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_CMD_TX_SIZE=65

# The gateway does not pair or bond, so none of this is needed. Re-enable SMP only if
# that changes - it is expensive here.
CONFIG_BT_SMP=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_DATA_LEN_UPDATE=n

# The Bluetooth host's own PRNG drags in TinyCrypt HMAC/SHA state. With SMP, privacy
# and bonding off, Zephyr's CTR-DRBG-backed random API is sufficient.
CONFIG_BT_HOST_CRYPTO_PRNG=n

# TI runs Bluetooth RX callbacks on the system workqueue and asks for at least 1200 B.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
CONFIG_ISR_STACK_SIZE=1536

# ------------------------------------------------------------------
# Entropy and crypto
# ------------------------------------------------------------------
# Spotflow's session and coredump IDs need sys_rand32_get(), and the board leaves
# entropy off by default. The CC23X0 entropy driver allocates its radio-noise buffer
# from the system heap at startup; 256 words is its enforced minimum and 64 bytes is
# enough to seed CTR-DRBG here.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_CC23X0_NOISE_INPUT_WORD_LENGTH=256
CONFIG_ENTROPY_CC23X0_ENTROPY_BYTE_LENGTH=64
CONFIG_CTR_DRBG_CSPRNG_GENERATOR=y

# No TLS on this device - the gateway terminates it. The board default would pull
# Mbed TLS in.
CONFIG_MBEDTLS=n

# One heap serves everything: the entropy driver's 1 KiB startup allocation, Spotflow's
# queues, and ~164 B per registered metric. IGNORE_MIN makes this value win over the
# sum of the per-subsystem adders. If k_malloc starts failing on hardware, raise this
# before touching anything else.
# Measured on hardware 2026-09-23: 4096 is NOT enough. Registering the catalog gave
# -ENOMEM ("metric sensor_errors not registered: -12", "Failed to allocate CBOR encoding
# buffer"), because the entropy driver's 1 KiB startup allocation plus ~164 B per metric
# plus the CBOR buffers overrun it. This is the runtime failure MEMORY.md predicted could
# only be found on the board.
CONFIG_HEAP_MEM_POOL_SIZE=5632
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# ------------------------------------------------------------------
# Spotflow: queues and buffers
# ------------------------------------------------------------------
CONFIG_SPOTFLOW_PROCESSING_THREAD_STACK_SIZE=1152

# The CC23x0 SoC does not implement SYS_REBOOT_COLD; without this the device spins
# after writing a coredump instead of resetting.
CONFIG_SPOTFLOW_COREDUMPS_REBOOT_WARM=y

# 128-byte chunks and a single queued chunk. Upload is slower for it, but at a 23-byte
# MTU the link is the bottleneck anyway, and this keeps the heap footprint at ~512 B.
CONFIG_SPOTFLOW_COREDUMPS_CHUNK_SIZE=128
CONFIG_SPOTFLOW_COREDUMPS_BACKEND_QUEUE_SIZE=1
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_COREDUMPS=512
CONFIG_SPOTFLOW_COREDUMPS_THREAD_STACK_SIZE=512

# Log records must be short. Anything longer than the buffer is truncated or dropped,
# which is why the application's logging style rule is ~90 characters per line.
CONFIG_SPOTFLOW_LOG_BACKEND_QUEUE_SIZE=2
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_LOGGING=512
CONFIG_SPOTFLOW_LOG_BUFFER_SIZE=96
CONFIG_SPOTFLOW_CBOR_LOG_MAX_LEN=192
CONFIG_SPOTFLOW_LOG_INCLUDE_BODY_TEMPLATE=n

# The SDK's own chatter stays at warning level; it is not what the demo is about.
CONFIG_SPOTFLOW_MODULE_DEFAULT_LOG_LEVEL=2
CONFIG_SPOTFLOW_LOGS_PROCESSING_LOG_LEVEL=2
# INFO, not warning: the coredump component announces "All coredump chunks enqueued" and
# "Coredump successfully sent." at INFO, and those two lines are how the upload is timed
# over a 23-byte MTU - the measurement that decides whether the demo keeps a full 36 KiB
# dump or falls back to MEMORY_DUMP_MIN. At warning level the upload is invisible.
CONFIG_SPOTFLOW_COREDUMPS_PROCESSING_LOG_LEVEL=3

# DELTA: fleet labels (firmware version, hardware revision, profile, sensor backend)
# do not fit the 64-byte minimum the SDK sample uses.
CONFIG_SPOTFLOW_SESSION_METADATA_BUFFER_SIZE=192

# Cloud configuration is not persisted: Settings/NVS would need its own RAM budget.
# Consequence for the demo: a log level set from the portal does not survive a reset.
CONFIG_SPOTFLOW_SETTINGS=n

# ------------------------------------------------------------------
# Metrics
# ------------------------------------------------------------------
# DELTA: 16 slots, not 10. Six go to system metrics, ten to the diagnostics catalog.
# Costs ~72 B of static RAM per slot plus ~164 B of heap per metric actually registered.
# 12, not 16: five system metrics and seven application ones. See diag_metrics.h for
# what was cut and why - the catalog was trimmed on hardware evidence, not guesswork.
CONFIG_SPOTFLOW_METRICS_MAX_REGISTERED=12
CONFIG_SPOTFLOW_METRICS_MAX_NAME_LENGTH=32
CONFIG_SPOTFLOW_METRICS_MAX_LABELS_PER_METRIC=1
# Each queued metric message holds a CBOR buffer allocated from the same 5.5 KiB heap,
# so queue depth is heap depth: 4 x 256 B can be a kilobyte in flight. Both of these are
# already at the SDK's enforced minimums (queue >= 4, buffer >= 256) - it refuses to go
# lower - so the heap had to be found by cutting metrics instead.
CONFIG_SPOTFLOW_METRICS_QUEUE_SIZE=4
CONFIG_SPOTFLOW_METRICS_CBOR_BUFFER_SIZE=256
CONFIG_SPOTFLOW_METRICS_HEARTBEAT=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT_INTERVAL=60
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_METRICS=4096

# System metrics: heap, connection state, reset cause and two thread stacks. Network
# needs Zephyr networking, and this Zephyr has no CPU_LOAD subsystem.
CONFIG_SPOTFLOW_METRICS_SYSTEM_HEAP=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_CONNECTION=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_RESET_CAUSE=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_NETWORK=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_CPU=n
# Thread stack metrics are OFF, and this is a measured trade rather than a preference.
#
# The heap ran with about 100 B of margin, which is why the CBOR encoder failed
# intermittently at aggregation flush boundaries rather than consistently. These two
# metrics (thread_stack_free_bytes, thread_stack_used_percent) cost 328 B of that heap
# and two messages in every flush burst, and they only ever covered the main thread - the
# stack actually worth watching is the TI Bluetooth task's, and its k_thread is not
# reachable from application code to register.
#
# Turn back on only with heap to spare; INIT_STACKS and THREAD_STACK_INFO stay enabled in
# prj.conf, so the same numbers are still available over the console.
CONFIG_SPOTFLOW_METRICS_SYSTEM_STACK=n

CONFIG_SPOTFLOW_METRICS_SYSTEM_COLLECTION_INTERVAL=30
CONFIG_SPOTFLOW_METRICS_SYSTEM_AGGREGATION_INTERVAL=60
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_METRICS_SYSTEM=8192

# ------------------------------------------------------------------
# Logging subsystem
# ------------------------------------------------------------------
# DELTA: LOG_MAX_LEVEL=4 so DEBUG records exist in the image for the cloud to unlock.
# The SDK sample compiles them out entirely, which would make that demo impossible.
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=256
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=640

# Local console. Worth 56 bytes of RAM (measured) and invaluable during bring-up.
CONFIG_LOG_BACKEND_UART=y

# ------------------------------------------------------------------
# Application
# ------------------------------------------------------------------
# The duty cycle state machine runs on the main thread: one application thread, no
# more. See MEMORY.md for why that is a design rule rather than a preference.
CONFIG_MAIN_STACK_SIZE=1152

# Cortex-M0+ has no MPU, so this canary is the only stack-overflow detection available.
CONFIG_STACK_SENTINEL=y

# ------------------------------------------------------------------
# Power management: off, deliberately
# ------------------------------------------------------------------
# The board defconfig turns PM on. v1 does not use it: the duty cycle sleeps on k_sleep
# and the battery figure is modelled from time-in-state (see power_model.c), so turning
# it off costs the demo nothing and saved 352 B of RAM we needed.
#
# An earlier version of this comment claimed it also bought reflashability, because
# standby was thought to be what blocked the debugger. That was wrong: the UniFlash GUI
# programmed this board while PM-enabled firmware was running, and the connect error
# persisted with PM off. The real cause was SWD being disabled in the target config. See
# ti/PLAN.md, B1.
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# Keep the application image clear of the coredump partition: overflow becomes a link
# error instead of silent corruption of stored dumps.
CONFIG_FLASH_LOAD_SIZE=0x70000
