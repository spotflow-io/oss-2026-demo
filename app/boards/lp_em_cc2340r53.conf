# LP-EM-CC2340R53 resource and platform profile.
#
# This board has 64 KiB of SRAM. TI's Bluetooth link-layer heap reserves 16 KiB, compared
# with 6.25 KiB on CC2340R5; every application-owned capacity below deliberately matches
# the R5 profile so either demo board has the same throughput and timing. The remaining
# headroom is left available rather than creating board-dependent behavior.
#
# Keep target resource choices here rather than in prj.conf so a future CC35x1 profile
# can use that device's larger memory and different peripherals. This profile was derived
# from the measured R5 profile and has also been built, flashed and run on R53 hardware.

# ------------------------------------------------------------------
# TI Bluetooth runtime
# ------------------------------------------------------------------
# The SoC selects DYNAMIC_THREAD, and the TI Bluetooth stack creates its tasks through
# TI's DPL, which allocates their stacks from Zephyr's dynamic stack pool (2 slots).
# TaskP_DEFAULT_STACK_SIZE is #defined as this symbol, so the slot size and the
# requested size shrink together and the requests still fit the pool.
#
# DELTA: reducing this from TI's default is the largest saving in the R5-derived profile
# (-960 B). R53 does not need the saving, but retaining it keeps both boards' runtime
# behavior alike.
# RISK: this is the Bluetooth stack's own task stack, below TI's default. Only hardware
# proves 1024 is enough; raise this first if stack headroom becomes thin.
CONFIG_DYNAMIC_THREAD_STACK_SIZE=1024

# ------------------------------------------------------------------
# Bluetooth LE transport
# ------------------------------------------------------------------
# 23-byte ATT MTU is the BLE minimum: ~20 payload bytes per notification, about 444 B/s
# after framing. Spotflow fragments larger messages. R53 has room for a larger MTU, but
# retaining the R5 values keeps coredump upload behavior identical on both demo boards.
#
# MEASURED on R5, whole-image RAM, if it is ever worth buying goodput back:
# MTU 23 -> 36528 B, 39 -> 36624, 47 -> 36672, 55 -> 36720, 69 -> 36824, of 36864.
# MTU 55 gives 2.6x the goodput for 192 B. BOTH buffer sizes have to move: the local ATT
# MTU is MIN(BT_L2CAP_RX_MTU, BT_L2CAP_TX_MTU), and BT_L2CAP_RX_MTU is
# BT_BUF_ACL_RX_SIZE - 4. Raising TX alone builds cleanly but still negotiates 23.
CONFIG_BT_L2CAP_TX_MTU=23
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_RX_COUNT=2
CONFIG_BT_L2CAP_TX_BUF_COUNT=3
CONFIG_BT_ATT_TX_COUNT=3
CONFIG_BT_CONN_TX_MAX=3
CONFIG_BT_BUF_EVT_RX_SIZE=68
CONFIG_BT_BUF_EVT_RX_COUNT=3
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_CMD_TX_SIZE=65

# The gateway does not pair or bond, so none of this is needed. Re-enable SMP only if
# that changes. These features are expensive on R5; keeping them off on R53 ensures the
# two demo boards expose the same Bluetooth behavior. A future target profile may choose
# differently without changing prj.conf.
CONFIG_BT_SMP=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_DATA_LEN_UPDATE=n

# The Bluetooth host's own PRNG drags in TinyCrypt HMAC/SHA state. With SMP, privacy and
# bonding off, Zephyr's CTR-DRBG-backed random API is sufficient.
CONFIG_BT_HOST_CRYPTO_PRNG=n

# TI runs Bluetooth RX callbacks on the system workqueue and asks for at least 1200 B.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
CONFIG_ISR_STACK_SIZE=1536

# ------------------------------------------------------------------
# Entropy and crypto
# ------------------------------------------------------------------
# Spotflow's session and coredump IDs need sys_rand32_get(), and the board leaves
# entropy off by default. The CC23X0 entropy driver allocates its radio-noise buffer
# from the system heap at startup; 256 words is its enforced minimum and 64 bytes is
# enough to seed CTR-DRBG here.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_CC23X0_NOISE_INPUT_WORD_LENGTH=256
CONFIG_ENTROPY_CC23X0_ENTROPY_BYTE_LENGTH=64
CONFIG_CTR_DRBG_CSPRNG_GENERATOR=y

# No TLS runs on this device: the BLE gateway terminates it. The board default would pull
# Mbed TLS in, so disable it explicitly rather than paying that cost accidentally.
CONFIG_MBEDTLS=n

# ------------------------------------------------------------------
# Shared heap
# ------------------------------------------------------------------
# One heap serves everything: the entropy driver's 1 KiB startup allocation, Spotflow's
# queues, and roughly 164 B per registered metric. IGNORE_MIN makes this value win over
# the sum of the per-subsystem adders. If k_malloc starts failing on hardware, raise this
# before touching anything else. It intentionally matches R5 even though R53 has more RAM.
#
# Measured on R5 hardware 2026-09-23: 4096 is NOT enough. Registering the catalogue gave
# -ENOMEM ("metric sensor_errors not registered: -12", "Failed to allocate CBOR encoding
# buffer"), because the entropy driver's 1 KiB startup allocation plus the metrics and
# CBOR buffers overran it. This runtime failure could not be established from the linker
# report alone. R53 retains the proven 5632-byte value for equivalent behavior.
CONFIG_HEAP_MEM_POOL_SIZE=5632
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# ------------------------------------------------------------------
# Spotflow transport queues and buffers
# ------------------------------------------------------------------
CONFIG_SPOTFLOW_PROCESSING_THREAD_STACK_SIZE=1152

# The CC23x0 SoC does not implement SYS_REBOOT_COLD; without this the device spins after
# writing a coredump instead of resetting.
CONFIG_SPOTFLOW_COREDUMPS_REBOOT_WARM=y

# 128-byte chunks and a single queued chunk. Upload is slower for it, but at a 23-byte
# MTU the link is the bottleneck anyway, and this keeps the heap footprint at about 512 B.
CONFIG_SPOTFLOW_COREDUMPS_CHUNK_SIZE=128
CONFIG_SPOTFLOW_COREDUMPS_BACKEND_QUEUE_SIZE=1
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_COREDUMPS=512
CONFIG_SPOTFLOW_COREDUMPS_THREAD_STACK_SIZE=512

# Log records must be short. Anything longer than the buffer is truncated or dropped,
# which is why the application's logging style rule is roughly 90 characters per line.
CONFIG_SPOTFLOW_LOG_BACKEND_QUEUE_SIZE=2
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_LOGGING=512
CONFIG_SPOTFLOW_LOG_BUFFER_SIZE=96
CONFIG_SPOTFLOW_CBOR_LOG_MAX_LEN=192
CONFIG_SPOTFLOW_LOG_INCLUDE_BODY_TEMPLATE=n

# Cloud configuration is not persisted: Settings/NVS would need its own RAM budget.
# Consequence for the demo: a log level set from the portal does not survive a reset.
CONFIG_SPOTFLOW_SETTINGS=n

# ------------------------------------------------------------------
# Spotflow metrics resources
# ------------------------------------------------------------------
# Each queued metric message holds a CBOR buffer allocated from the same 5.5 KiB heap,
# so queue depth is heap depth: 4 x 256 B can be a kilobyte in flight. Both values are
# already at the SDK's enforced minimums (queue >= 4, buffer >= 256), so the heap had to
# be found by trimming the metric catalogue instead of reducing these further.
CONFIG_SPOTFLOW_METRICS_QUEUE_SIZE=4
CONFIG_SPOTFLOW_METRICS_CBOR_BUFFER_SIZE=256
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_METRICS=4096

# Network metrics need Zephyr networking, and this TI downstream has no CPU_LOAD
# subsystem. These are target capabilities, unlike the portable system metrics selected
# in prj.conf.
CONFIG_SPOTFLOW_METRICS_SYSTEM_NETWORK=n
CONFIG_SPOTFLOW_METRICS_SYSTEM_CPU=n

# Thread-stack metrics are OFF, and this is a measured trade rather than a preference.
#
# The heap ran with about 100 B of margin on R5, which is why the CBOR encoder failed
# intermittently at aggregation flush boundaries rather than consistently. These two
# metrics (thread_stack_free_bytes and thread_stack_used_percent) cost 328 B of heap and
# two messages in every flush burst. They only covered the main thread; the stack worth
# watching is the TI Bluetooth task's, and its k_thread is not reachable from application
# code to register.
#
# Turn them back on in this R53 profile only if different behavior between demo boards is
# acceptable. INIT_STACKS and THREAD_STACK_INFO stay enabled in prj.conf, so the same
# main-thread information remains available over the console.
CONFIG_SPOTFLOW_METRICS_SYSTEM_STACK=n
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_METRICS_SYSTEM=8192

# ------------------------------------------------------------------
# Zephyr logging resources
# ------------------------------------------------------------------
# Deferred logging bounds work in producer contexts; these buffer and stack sizes are
# part of the measured CC23x0 RAM profile rather than portable logging policy.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=256
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=640

# Local console. Worth 56 bytes of RAM (measured on R5) and invaluable during bring-up.
CONFIG_LOG_BACKEND_UART=y

# ------------------------------------------------------------------
# Application and fault-detection stacks
# ------------------------------------------------------------------
# The duty-cycle state machine runs on the main thread: one application thread, no more.
# This is a design rule on R5 rather than a preference, and R53 keeps the same topology.
CONFIG_MAIN_STACK_SIZE=1152

# Cortex-M0+ has no MPU, so this canary is the only stack-overflow detection available.
CONFIG_STACK_SENTINEL=y

# ------------------------------------------------------------------
# Power management
# ------------------------------------------------------------------
# The board defconfig turns PM on. This version does not use it: the duty cycle sleeps on
# k_sleep(), and the battery figure is modelled from time-in-state (see power_model.c), so
# turning it off costs the demo nothing. It saved 352 B on R5 and remains disabled here so
# both boards behave alike.
#
# An earlier version of this rationale claimed PM also bought reflashability because
# standby was thought to block the debugger. Hardware testing disproved that: UniFlash
# programmed PM-enabled firmware, and the connection error persisted with PM off. The
# actual cause was SWD being disabled in the target configuration.
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# ------------------------------------------------------------------
# Internal flash boundary
# ------------------------------------------------------------------
# Keep the application image clear of the coredump partition: overflow becomes a link
# error instead of silent corruption of stored dumps. This must match the partition map
# in lp_em_cc2340r53.overlay.
CONFIG_FLASH_LOAD_SIZE=0x70000
