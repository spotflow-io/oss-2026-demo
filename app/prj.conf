# Portable configuration for the asset tracker demo.
#
# This file says WHAT the firmware does, and applies to every board. The RAM budget -
# buffer sizes, queue depths, thread stacks - lives in boards/cc23x0.conf and the flash
# layout in app.overlay, so that reading this file tells you about the demo rather than
# about the memory ceiling.

# ------------------------------------------------------------------
# Spotflow: the whole point of the device
# ------------------------------------------------------------------
CONFIG_SPOTFLOW=y
CONFIG_SPOTFLOW_TRANSPORT_BLE=y
CONFIG_SPOTFLOW_LOG_BACKEND=y
CONFIG_SPOTFLOW_METRICS=y
CONFIG_SPOTFLOW_METRICS_SYSTEM=y
CONFIG_SPOTFLOW_COREDUMPS=y

# Identity. The device ID is what you type into the Spotflow portal to find this unit;
# change it if you run more than one board against the same workspace.
CONFIG_SPOTFLOW_DEVICE_ID="asset-tracker-01"
CONFIG_BT_DEVICE_NAME="Asset Tracker"
CONFIG_BT_DEVICE_APPEARANCE=0

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
# DEBUG is compiled in (LOG_MAX_LEVEL=4 in boards/cc23x0.conf) but not sent: the demo
# raises the sent level from the cloud to reveal detail from a device already in the
# field. Modules that carry the story keep their own DEBUG level; see app/Kconfig.
CONFIG_LOG=y
CONFIG_SPOTFLOW_DEFAULT_SENT_LOG_LEVEL=3

# ------------------------------------------------------------------
# Coredumps
# ------------------------------------------------------------------
# Zephyr 3.7 offers two dump extents: the faulting context and current stack only
# (MEMORY_DUMP_MIN), or all of RAM (MEMORY_DUMP_LINKER_RAM). The per-thread mode is a
# later Zephyr feature and does not exist here.
#
# MEASURED 2026-09-25: a full-RAM dump is 36 KiB and takes **83 seconds** to upload over
# the 23-byte ATT MTU - about 444 B/s, roughly one notification per connection interval.
# That is a minute and a half of dead air in the middle of the demo, so the full dump
# loses to the minimal one.
#
# MIN carries the fault context and the faulting thread's stack, which is exactly what a
# backtrace needs - the call chain through drop_detect_record still symbolicates. The
# rest of RAM is a luxury nobody reads on stage.
#
# To go back to everything: CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_LINKER_RAM=y, and budget
# the 83 seconds.
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# -Og so locals and line numbers survive into the dump. A coredump nobody can read is
# not a demo.
CONFIG_DEBUG_OPTIMIZATIONS=y

# ------------------------------------------------------------------
# Board I/O: one button drives the demo, two LEDs show device state on the booth table
# ------------------------------------------------------------------
CONFIG_GPIO=y

# The BMI270 hangs off I2C0. Selected by CONFIG_APP_SENSOR_BMI270, kept explicit here
# so a build with the simulated backend still reads sensibly.
CONFIG_I2C=y

# ------------------------------------------------------------------
# Watchdog
# ------------------------------------------------------------------
CONFIG_WATCHDOG=y

# ------------------------------------------------------------------
# Diagnostics helpers the metrics rely on
# ------------------------------------------------------------------
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_HWINFO=y
