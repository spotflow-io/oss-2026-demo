# Portable configuration for the asset tracker demo.
#
# This file says WHAT the firmware does and applies to every supported board. Resource
# budgets, platform workarounds and hardware layout live in boards/<board>.conf and
# boards/<board>.overlay. A future target can therefore choose capacities appropriate to
# its hardware without changing the behavior described here.

# ------------------------------------------------------------------
# Spotflow: the whole point of the device
# ------------------------------------------------------------------
CONFIG_SPOTFLOW=y
CONFIG_SPOTFLOW_LOG_BACKEND=y
CONFIG_SPOTFLOW_METRICS=y
CONFIG_SPOTFLOW_METRICS_SYSTEM=y
CONFIG_SPOTFLOW_COREDUMPS=y

# The SDK sample uses its 64-byte minimum. That is not enough for this demo's four fleet
# labels: firmware version, hardware revision, deployment profile and sensor backend all
# have to encode into the same metadata message.
CONFIG_SPOTFLOW_SESSION_METADATA_BUFFER_SIZE=192

# Identity. The device ID is what you type into the Spotflow portal to find this unit;
# change it if you run more than one board against the same workspace.
CONFIG_SPOTFLOW_DEVICE_ID="asset-tracker-01"

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
# DEBUG is compiled in but not sent by default: the demo raises the sent level from the
# cloud to reveal detail from a device already in the field. Modules that carry the story
# keep their own DEBUG level; see app/Kconfig. The SDK sample compiles DEBUG out entirely,
# which would make that remote log-level demonstration impossible. Compiling it in costs
# flash, while the board profiles separately control the RAM used for queued log records.
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SPOTFLOW_DEFAULT_SENT_LOG_LEVEL=3

# The SDK's own chatter stays at warning level; it is not what the demo is about.
CONFIG_SPOTFLOW_MODULE_DEFAULT_LOG_LEVEL=2
CONFIG_SPOTFLOW_LOGS_PROCESSING_LOG_LEVEL=2

# INFO, not warning: the coredump component announces "All coredump chunks enqueued" and
# "Coredump successfully sent." at INFO. Those lines are how upload time was measured
# over the 23-byte CC23x0 MTU, and they make the crash-to-cloud path visible on stage.
# At warning level an otherwise successful upload would appear silent.
CONFIG_SPOTFLOW_COREDUMPS_PROCESSING_LOG_LEVEL=3

# ------------------------------------------------------------------
# Coredumps
# ------------------------------------------------------------------
# Zephyr 3.7 offers two dump extents: the faulting context and current stack only
# (MEMORY_DUMP_MIN), or all of RAM (MEMORY_DUMP_LINKER_RAM). The per-thread mode is a
# later Zephyr feature and does not exist here.
#
# MEASURED 2026-09-25: a full-RAM dump is 36 KiB and takes **83 seconds** to upload over
# the 23-byte ATT MTU - about 444 B/s, roughly one notification per connection interval.
# That is a minute and a half of dead air in the middle of the demo, so the full dump
# loses to the minimal one.
#
# MIN carries the fault context and the faulting thread's stack, which is exactly what a
# backtrace needs - the call chain through drop_detect_record still symbolicates. The
# rest of RAM is a luxury nobody reads on stage.
#
# To go back to everything: CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_LINKER_RAM=y, and budget
# the 83 seconds.
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y

# -Og so locals and line numbers survive into the dump. A coredump nobody can read is
# not a demo.
CONFIG_DEBUG_OPTIMIZATIONS=y

# ------------------------------------------------------------------
# Metrics: application catalogue and reporting policy
# ------------------------------------------------------------------
# Four selected system metrics and eight application metrics exactly fill the registry.
# The catalogue was trimmed from an earlier 16-slot plan after hardware testing exposed
# the heap cost: each slot costs about 72 B of static RAM and every metric actually
# registered costs roughly another 164 B of heap. See diag_metrics.h for what was cut and
# why. The names and labels are catalogue properties, not board resource tuning.
CONFIG_SPOTFLOW_METRICS_MAX_REGISTERED=12
CONFIG_SPOTFLOW_METRICS_MAX_NAME_LENGTH=32
CONFIG_SPOTFLOW_METRICS_MAX_LABELS_PER_METRIC=1

# A heartbeat distinguishes an idle but connected tracker from one that has disappeared.
# System and application collection both use the same one-minute reporting rhythm.
CONFIG_SPOTFLOW_METRICS_HEARTBEAT=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT_INTERVAL=60

# Heap usage, connection state and reset cause answer the basic remote-diagnostics
# questions on every target. Heap contributes free and allocated byte gauges, making four
# system metrics in total. Target-specific capabilities such as network, CPU-load and
# thread-stack metrics remain in boards/<board>.conf.
CONFIG_SPOTFLOW_METRICS_SYSTEM_HEAP=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_CONNECTION=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_RESET_CAUSE=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_COLLECTION_INTERVAL=30
CONFIG_SPOTFLOW_METRICS_SYSTEM_AGGREGATION_INTERVAL=60

# ------------------------------------------------------------------
# Board I/O: one button drives the demo, two LEDs show device state on the booth table
# ------------------------------------------------------------------
CONFIG_GPIO=y

# ------------------------------------------------------------------
# Watchdog
# ------------------------------------------------------------------
CONFIG_WATCHDOG=y

# ------------------------------------------------------------------
# Diagnostics helpers the metrics rely on
# ------------------------------------------------------------------
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_HWINFO=y
